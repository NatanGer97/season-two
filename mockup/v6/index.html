<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#120D10" />
  <title>הסיפור שלנו · עונה 2 · v6 alive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@300;400;600&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="v6.css" />
</head>
<body>
  <div id="app" class="app">
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- Calendar: time itself. Always underneath. -->
    <section id="calendar" class="calendar" aria-hidden="true">
      <header class="cal-head">
        <h1 id="cal-month" class="cal-month"></h1>
        <span id="cal-year" class="cal-year"></span>
      </header>
      <div class="cal-dow"><span>א׳</span><span>ב׳</span><span>ג׳</span><span>ד׳</span><span>ה׳</span><span>ו׳</span><span class="sat">ש׳</span></div>
      <div class="cal-body">
        <div id="cal-grid" class="cal-grid"></div>
        <span id="cal-ring" class="cal-ring"></span>
      </div>
      <p id="cal-note" class="hand cal-note"></p>
      <nav id="timeline" class="timeline"></nav>
    </section>

    <!-- Episode layer -->
    <section id="stage" class="stage"></section>

    <!-- Gold dust, over everything but the UI -->
    <canvas id="dust" class="dust" aria-hidden="true"></canvas>

    <!-- Intro -->
    <section id="intro" class="intro">
      <span class="intro-ring" aria-hidden="true"></span>
      <div class="intro-lines"></div>
      <button id="intro-go" class="btn intro-go" type="button">לצפייה בפרק</button>
    </section>

    <div id="flash" class="flash" aria-hidden="true"></div>

    <button id="mute" class="mute" type="button" aria-label="השתקה" data-nogesture>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <div id="hint" class="hint" aria-live="polite">
      <span class="ghost" aria-hidden="true"><i class="trail"></i><i class="dot"></i></span>
      <span class="hint-pill"><svg class="hint-arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="hint-text"></span></span>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="sound.js"></script>
  <script src="alive.js"></script>
  <script src="widgets.js"></script>
  <script src="app.js"></script>
</body>
</html>
